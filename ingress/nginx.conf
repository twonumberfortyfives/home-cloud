events {}

http {
    # Upstreams for each service
    upstream frontend {
        server frontend:4200;
    }

    upstream backend {
        server backend:8000;
    }

    upstream oauth2-proxy {
        server oauth2-proxy:4180;
    }

    # Oauth2-Proxy Server
    server {
        listen 4180 ssl;
        server_name localhost;
        port_in_redirect off;

        ssl_certificate /certs/localhost.pem;
        ssl_certificate_key /certs/localhost-key.pem;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_pass http://oauth2-proxy;
        }
    }

    # Platform Server
    server {
        listen 9000 ssl;
        server_name localhost;

        ssl_certificate /certs/localhost.pem;
        ssl_certificate_key /certs/localhost-key.pem;

        # Redirect to OAuth2-Proxy if 401 Unauthorized
        error_page 401 = @error401;
        location @error401 {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://oauth2-proxy/oauth2/sign_in?rd=$scheme://$http_host$request_uri;
        }

        # The Internal Authenticator
        location = /authenticate {
            internal;

            proxy_http_version 1.1;
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;

            proxy_pass http://oauth2-proxy/oauth2/auth;
        }

        # Backend API
        location /api/ {
            auth_request /authenticate;

            proxy_http_version 1.1;
            # Grab data returned by the proxy
            auth_request_set $auth_header $upstream_http_authorization;

            proxy_set_header Authorization $auth_header;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;

            proxy_pass http://backend;
        }

        # Angular Apps
        location / {
            auth_request /authenticate;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_cache_bypass $http_upgrade;

            proxy_pass http://frontend;
        }
    }
}
