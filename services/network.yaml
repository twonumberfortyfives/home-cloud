services:
  ingress:
    build:
      context: ../ingress
      dockerfile: Dockerfile
    depends_on:
      - frontend
      - backend
      - oauth2-proxy
    volumes:
      - ../.certs/localhost.pem:/certs/localhost.pem
      - ../.certs/localhost-key.pem:/certs/localhost-key.pem
    ports:
      - "9000:9000"
      - "4180:4180"
    networks:
      - home-cloud-network

  oauth2-proxy:
    build:
      context: ../oauth2-proxy
      dockerfile: Dockerfile
    depends_on:
      - redis
    volumes:
      - ../oauth2-proxy:/oauth2-proxy
    secrets:
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
    networks:
      - home-cloud-network
