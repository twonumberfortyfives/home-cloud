name: home-cloud
include:
  - ./services/network.yaml
  - ./services/databases.yaml
  - ./services/fullstack.yaml

secrets:
  GOOGLE_CLIENT_ID:
    file: ./.secrets/GOOGLE_CLIENT_ID
  GOOGLE_CLIENT_SECRET:
    file: ./.secrets/GOOGLE_CLIENT_SECRET

networks:
  home-cloud-network:
    driver: bridge
