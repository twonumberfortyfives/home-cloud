## oauth2-proxy configuration file
## https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview

# ==========================================================
# AUTHENTICATION & IDENTITY
# ==========================================================
provider                  = "google"
oidc_issuer_url           = "https://accounts.google.com"
code_challenge_method     = "S256"

# ==========================================================
# COOKIE & SESSION
# ==========================================================
cookie_name               = "session_id"
cookie_domains            = ["localhost"]
cookie_samesite           = "lax"
cookie_secure             = true
cookie_httponly           = true
cookie_refresh            = "50m"
cookie_expire             = "168h"

# ==========================================================
# TRAFFIC & HEADERS
# ==========================================================
http_address              = "0.0.0.0:4180"
upstreams                 = ["static://200"]
redirect_url              = "https://localhost:4180/oauth2/callback"
custom_templates_dir      = "/data/custom-templates"

pass_authorization_header = true
pass_access_token         = true
set_authorization_header  = true
skip_jwt_bearer_tokens    = true
reverse_proxy             = true

# ==========================================================
# 🛡️ SECURITY WHITELISTS
# ==========================================================
email_domains             = ["gmail.com"]
whitelist_domains         = ["localhost:9000", "localhost:4180"]

# debug config for local development
auth_logging              = true
show_debug_on_error       = true